<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0838">
  <title>Ai Là Triệu Phú Toán Học</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="vendor/katex/katex.min.js"></script>
  <script defer src="vendor/katex/auto-render.min.js"></script>
  <script type="module" src="build/play.js"></script>
</head>
<body class="play">
  <div class="stage-bg"><div class="beams"></div></div>
  <div class="net-banner" id="netBanner" hidden></div>
  <div class="phone">
    <header>
      <div class="brand site"><span class="badge-wrap"><span class="badge"><span class="b-small">AI LÀ TRIỆU PHÚ</span><span class="b-big">TOÁN HỌC</span></span></span></div>
      <div class="who" id="who"></div>
    </header>

    <section id="old" class="card panel" hidden>
      <h2 style="margin:0">Trình duyệt chưa chạy được trò chơi</h2>
      <p>Hãy mở đường link bằng Chrome hoặc Safari bản mới (iPhone: iOS 14.5 trở lên; Android: Chrome 64 trở lên), hoặc tải lại trang.</p>
    </section>
    <noscript><div class="card panel">Cần bật JavaScript để chơi.</div></noscript>
    <script>setTimeout(function () { if (!window.__appStarted) document.getElementById('old').hidden = false; }, 8000);</script>

    <section id="join" class="card panel" hidden>
      <h2 style="margin:0">Vào lớp</h2>
      <form id="joinForm" autocomplete="off">
        <label for="code">Mã phòng</label>
        <input id="code" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="4 chữ số">
        <label for="name">Tên hiển thị</label>
        <input id="name" maxlength="24" placeholder="Ví dụ: Minh Anh">
        <button class="btn primary" type="submit" id="joinBtn">Vào lớp</button>
        <div class="err" id="joinErr"></div>
      </form>
    </section>

    <section id="wait" class="card wait" hidden>
      <div class="spinner"></div>
      <h2>Đã vào phòng</h2>
      <div class="muted">Chờ giáo viên bắt đầu.</div>
    </section>

    <section id="q" hidden style="display:flex;flex-direction:column;gap:.8em">
      <div class="banner" id="banner" hidden></div>
      <div class="qhead"><span class="lv" id="qLevel"></span><span class="secs" id="secs"></span></div>
      <div class="tbar" id="tbar"><i id="tfill"></i></div>
      <div class="qwrap"><div class="question" id="qText"></div></div>
      <div class="qnote" id="qNote" hidden></div>
      <div class="answers" id="answers"></div>
      <div class="status" id="status"></div>
      <div class="teacher-line" id="teacher" hidden></div>
      <div class="note" id="note" hidden></div>
    </section>

    <section id="end" class="card wait" hidden>
      <svg class="trophy" viewBox="0 0 24 24"><path d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.9V17h3v2H8v-2h3v-2.1A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3V3Zm10 4v3a2 2 0 0 0 1-1.7V7h-1ZM6 7v1.3A2 2 0 0 0 7 10V7H6Zm2 13h8v1H8v-1Z"/></svg>
      <div class="result-big" id="myScore"></div>
      <h2 id="endTitle"></h2>
      <div class="outro-seq" id="outroSeq" hidden></div>
      <ol class="board summary" id="board" style="text-align:left"></ol>
    </section>
  </div>
</body>
</html>
