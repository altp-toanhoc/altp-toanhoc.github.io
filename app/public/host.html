<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ai Là Triệu Phú Toán Học · Màn giáo viên</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="vendor/katex/katex.min.js"></script>
  <script defer src="vendor/katex/auto-render.min.js"></script>
  <script type="module" src="build/host.js"></script>
</head>
<body class="host">
  <div class="stage-bg"><div class="beams"></div></div>
  <div class="net-banner" id="netBanner" hidden></div>

  <header class="topbar">
    <div class="brand site"><span class="badge-wrap"><span class="badge"><span class="b-small">AI LÀ TRIỆU PHÚ</span><span class="b-big">TOÁN HỌC</span></span></span></div>
    <div class="topic" id="topic"></div>
    <div class="spacer"></div>
    <div class="room-pill" id="roomPill" hidden>Mã phòng <b id="roomCode"></b> · <span id="playerCount">0</span> học sinh</div>
    <button class="icon-btn" id="fsBtn" title="Toàn màn hình"><svg viewBox="0 0 24 24"><path d="M3 3h7v2H5v5H3zm11 0h7v7h-2V5h-5zM3 14h2v5h5v2H3zm16 0h2v7h-7v-2h5z"/></svg></button>
    <button class="icon-btn" id="soundBtn" title="Bật/tắt âm thanh"></button>
  </header>

  <main>
    <section id="setup" class="center" hidden>
      <div class="card setup-card">
        <h1 id="bankTitle"></h1>
        <button class="btn primary" id="bCreate" disabled>Tạo phòng</button>
        <p class="err" id="bankErr"></p>
        <p class="muted small" id="themeInfo" hidden></p>
      </div>
    </section>

    <section id="lobby" class="center" hidden>
      <div>
        <span class="badge-wrap lobby-badge"><span class="badge"><span class="b-small">AI LÀ TRIỆU PHÚ</span><span class="b-big">TOÁN HỌC</span></span></span>
        <img class="theme-logo lobby-logo" alt="Logo" hidden>
        <div class="card join-box">
          <div class="label">MỞ TRÊN ĐIỆN THOẠI</div>
          <div class="url" id="joinUrl"></div>
          <div class="join-row">
            <img id="qr" alt="Mã QR vào phòng">
            <div>
              <div class="label">MÃ PHÒNG</div>
              <div class="big-code" id="bigCode"></div>
            </div>
          </div>
        </div>
        <div class="lobby-count" id="lobbyCount">Chưa có học sinh nào vào phòng</div>
        <div class="names" id="names"></div>
      </div>
    </section>

    <section id="game" hidden>
      <div class="banner" id="banner" hidden></div>
      <div class="game-grid">
        <div class="main-col">
          <div class="qmeta"><span class="lv" id="qLevel"></span></div>
          <div class="question" id="qText"></div>
          <div class="qnote" id="qNote" hidden></div>
          <div class="answers" id="answers"></div>
        </div>
        <aside class="side-col">
          <div class="timer" id="timer">
            <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/><circle class="ring" id="ring" cx="60" cy="60" r="52"/></svg>
            <div class="secs" id="secs"></div>
          </div>
          <div class="answered" id="answered"></div>
          <div class="lifelines">
            <button class="lifeline" id="ll50" title="50:50 (phím F)">50:50<small>Bỏ 2 phương án</small></button>
            <button class="lifeline" id="llTv" title="Tổ tư vấn (phím T)">
              <span><svg viewBox="0 0 24 24"><path d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM8 13c-2.7 0-6 1.3-6 3.5V19h12v-2.5C14 14.3 10.7 13 8 13Zm8 0c-.5 0-1 0-1.6.1 1 .8 1.6 1.9 1.6 3.4V19h6v-2.5c0-2.2-3.3-3.5-6-3.5Z"/></svg><small>Tổ tư vấn</small></span>
            </button>
          </div>
          <ol class="ladder" id="ladder"></ol>
        </aside>
      </div>
    </section>

    <section id="final" hidden>
      <div class="final-wrap">
        <svg class="trophy" id="trophy" viewBox="0 0 24 24"><path d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.9V17h3v2H8v-2h3v-2.1A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3V3Zm10 4v3a2 2 0 0 0 1-1.7V7h-1ZM6 7v1.3A2 2 0 0 0 7 10V7H6Zm2 13h8v1H8v-1Z"/></svg>
        <div class="final-small" id="finalSmall">AI LÀ TRIỆU PHÚ TOÁN HỌC</div>
        <div class="final-title" id="finalTitle"></div>
        <div class="outro-seq" id="outroSeq" hidden></div>
        <div class="stats" id="finalStats"></div>
        <ol class="board summary" id="board"></ol>
      </div>
    </section>
  </main>

  <footer class="controls" id="controls" hidden>
    <button class="btn" id="bPause">Tạm dừng<kbd>Space</kbd></button>
    <button class="btn" id="bLock">Chốt đáp án<kbd>Enter</kbd></button>
    <button class="btn primary" id="bNext">Bắt đầu<kbd>N</kbd></button>
    <span class="sep"></span>
    <button class="btn" id="bFake" hidden>Thêm 30 học sinh ảo</button>
    <button class="btn" id="bNew">Phòng mới</button>
  </footer>
</body>
</html>
